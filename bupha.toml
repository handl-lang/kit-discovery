# bupha.toml — committed CI manifest for handl-lang/kit-discovery.
#
# Runner is this repo's ci.sh. Merge the [[repos]] entry into the shared
# watcher (~/.config/bupha/bupha.toml) or run: bupha watch --config bupha.toml

[[repos]]
name = "handl-lang/kit-discovery"
dir = "~/GitHub/handl-lang/kit-discovery"
branch = "refs/heads/main"
  [repos.runner]
  kind = "script"
  cmd = "bash ci.sh"
  cancel_running = true

[status]
kind = "github"
context = "ci/bupha"
