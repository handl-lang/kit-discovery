# workflows/gate.yaml — bespoke per-push gate for kit-discovery.
#
# Replaces the generated `handl-gates` python campaign: the ladder below
# is the repo's ci.sh contract inlined as a shell node (ci.sh stays in
# the tree until the fleet cuts over; this file no longer invokes it).
#
# Bupha/the fleet runner invokes:
#
#   GATE_REPO="$PWD" GATE_RESULTS="$PWD/.gate-results.jsonl" \
#     peregrin campaign run workflows/gate.yaml --result .ci-result.json
#
# Verdict: .ci-result.json `.conclusion` == "success" (result: rules map
# gate.pass/gate.fail + failure events).
#
# Ladder (ci.sh): uv sync --group dev → ruff check src →
# `ruff format --check src || ruff format src tests` (ci.sh's
# auto-format fallback, kept verbatim) → ty check → lint-imports →
# `python -m coverage run -m pytest` → `python -m coverage report`
# (pyproject fail_under floor).
#
# Lanes (MLOPT_GATES_LANE, same convention as eqsat/scripts/gates.sh):
# dev (default) deselects the `slow`-marked tests — the open-game
# `measured` fixtures (full-policy training + hundreds of game
# episodes) and the large-budget e-graph saturations, which together
# are the ~2h tail of the 2,998-test suite and exceed the fleet
# runner's ~6380s external TERM; full runs everything (hours-scale —
# a local/pre-release lane, not a per-push gate).  GATE_PYTEST_ARGS
# overrides the pytest arg string entirely (default "tests/ -q" plus
# the lane marker).
name: gate-kit-discovery

result:
  - event: gate.pass
    conclusion: success
  - event: gate.fail
    conclusion: failure
  - event: gate.failed
    conclusion: failure
  - event: gate.init.failed
    conclusion: failure
  - event: ensure.failed
    conclusion: failure

capabilities:
  env:
    - GATE_REPO
    - GATE_RESULTS
    - GATE_PYTEST_ARGS
    - GATE_TARGET_DIR
    - GATE_ENV_FILE
    - MLOPT_GATES_LANE

nodes:
  # --- init: validate inputs, fresh results file --------------------
  - id: gate.init
    driver: shell
    on: [start]
    emits: [gate.due, gate.init.failed]
    params:
      cmd: >-
        set -u;
        REPO="${config.gate.repo:-${env("GATE_REPO","")}}";
        [ -n "$REPO" ] || { echo "gate.repo is required — set GATE_REPO or config.gate.repo to an absolute checkout path"; exit 1; };
        [ -d "$REPO" ] || { echo "no such directory: $REPO"; exit 1; };
        RES="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/python.results.jsonl")}}";
        mkdir -p "$(dirname "$RES")";
        : > "$RES";
        echo "gate-kit-discovery: repo=$REPO results=$RES"
      timeout: 60
      emit:
        "0": gate.due
        default: gate.init.failed

  # --- ensure: sibling layout + shared cargo target env ------------
  - include: tamias:handl-gates@0.3.3//lib/ensure-siblings.node.yml
    id: gate.ensure
    on: [gate.due]
    emits: [ensure.done, ensure.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      target_dir: '${config.gate.target_dir:-${env("GATE_TARGET_DIR","auto")}}'
      env_file: '${config.gate.env_file:-${env("GATE_ENV_FILE","auto")}}'
      emit:
        "0": ensure.done
        default: ensure.failed

  # --- ladder: the ci.sh gate inlined --------------------------------
  - id: gate.ladder
    driver: shell
    on: [ensure.done]
    emits: [gate.done, gate.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      results: '${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/python.results.jsonl")}}'
      env_file: '${config.gate.env_file:-${env("GATE_ENV_FILE","auto")}}'
      # The dev lane (`-m "not slow"`) is ~45–75 min of pytest under
      # coverage on this host (measured 2026-11-25, T-117 — host was
      # under heavy external load, so treat as worst-case); the full
      # lane is hours-scale and exceeds both this timeout and the
      # fleet runner's ~6380s external TERM — run it locally with
      # MLOPT_GATES_LANE=full / GATE_PYTEST_ARGS.
      timeout: 7200
      cmd: |
        set -uo pipefail;
        REPO="${params.repo}";
        RESULTS="${params.results}";
        START=$(date +%s);
        cd "$REPO" || exit 1;
        REPO="$(pwd)";
        EF="${params.env_file}";
        [ "$EF" = "auto" ] && EF="$(dirname "$REPO")/.gate-env/$(basename "$REPO").env";
        [ -z "$EF" ] || [ ! -f "$EF" ] || . "$EF";
        export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin";
        ( set -euo pipefail;
          LANE="${MLOPT_GATES_LANE:-dev}";
          PYTEST_M=();
          if [[ "$LANE" == "dev" ]]; then
            PYTEST_M=(-m "not slow");
          elif [[ "$LANE" != "full" ]]; then
            echo "unknown MLOPT_GATES_LANE=$LANE (dev|full)" >&2; exit 2;
          fi;
          uv sync --group dev;
          .venv/bin/ruff check src;
          .venv/bin/ruff format --check src || .venv/bin/ruff format src tests;
          .venv/bin/ty check;
          .venv/bin/lint-imports;
          if [ -n "${GATE_PYTEST_ARGS:-}" ]; then
            .venv/bin/python -m coverage run -m pytest $GATE_PYTEST_ARGS;
          else
            .venv/bin/python -m coverage run -m pytest tests/ -q "${PYTEST_M[@]}";
          fi;
          .venv/bin/python -m coverage report );
        rc=$?;
        if [ -n "$RESULTS" ]; then
          esc=$(printf '%s' "$REPO" | sed 's/\\/\\\\/g; s/"/\\"/g');
          printf '{"family":"python","repo":"%s","rc":%s,"secs":%s}\n' "$esc" "$rc" "$(( $(date +%s) - START ))" >> "$RESULTS" 2>/dev/null || true;
        fi;
        exit $rc
      emit:
        "0": gate.done
        default: gate.failed

  # --- report: terminal verdict from the results record -------------
  - id: gate.report
    driver: shell
    on: [gate.done, gate.failed]
    emits: [gate.pass, gate.fail]
    params:
      cmd: >-
        set -u;
        F="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/python.results.jsonl")}}";
        [ -s "$F" ] || { echo "no results record — gate produced nothing"; exit 1; };
        line=$(tail -n 1 "$F");
        rc=$(printf '%s' "$line" | sed -n 's/.*"rc":\([0-9][0-9]*\).*/\1/p');
        echo "gate-kit-discovery verdict: $line";
        [ "${rc:-1}" = "0" ]
      timeout: 60
      emit:
        "0": gate.pass
        default: gate.fail
